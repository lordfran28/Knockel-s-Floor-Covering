<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Try a floor in your room · Knockel's Floor Covering</title>
<meta name="description" content="Take a picture of your room and try Knockel's floors in it: wood, vinyl plank, tile, stone and carpet. Your picture stays on your device.">
<meta name="theme-color" content="#163536">
<link rel="stylesheet" href="assets/site.css?v=4">
<style>
/* Behind the studio, faintly: an old patterned tile floor (see the credits) */
body{background:#F4F1EA}
body::before{background:#F4F1EA url(assets/photos/pattern-floor.jpg) 0 0/var(--pat,360px) repeat;opacity:.17}
body::after{background:radial-gradient(90% 70% at 50% 0%,rgba(255,255,255,.55),rgba(255,255,255,0) 70%)}
@media (max-width:900px){body::before{background-image:url(assets/photos/pattern-floor.jpg);--pat:240px}}
.top{color:var(--ink);background:rgba(244,241,234,.9);box-shadow:0 1px 0 var(--line)}
.studio{display:grid;grid-template-columns:minmax(220px,270px) minmax(0,1fr) minmax(220px,270px);gap:0;height:100svh;padding-top:64px}
.rail{overflow-y:auto;padding:18px 16px 40px;border-right:1px solid var(--line);background:rgba(250,248,243,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overscroll-behavior:contain}
.rail.right{border-right:0;border-left:1px solid var(--line)}
.rail h2{font-size:1.3rem;margin:.3em 0 .8em}
.rail h2 + .samples{margin-bottom:1.6em}
.samples{display:grid;gap:14px;grid-template-columns:1fr;margin:0;padding:0;list-style:none}
.sample{display:block;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer;color:inherit;font:inherit;-webkit-tap-highlight-color:transparent}
.sample img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:2px;outline:3px solid transparent;outline-offset:2px;transition:outline-color .2s ease,transform .2s ease;
  box-shadow:0 8px 18px -12px rgba(40,30,20,.6)}
.sample:hover img{transform:translateY(-2px)}
.sample[aria-pressed="true"] img{outline-color:var(--oak)}
.sample .ph{position:relative;display:block}
.sample .nm{display:block;margin-top:.45em;font:600 1.02rem/1.2 var(--slab)}
.sample[aria-pressed="true"] .nm::after{content:"  \2713";color:var(--oak)}
.sample .sub{display:block;font-size:.86rem;color:#6B5F53;margin-top:.1em}
.sample .price{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .3em;margin-top:.2em;font:500 1rem/1.25 var(--slab);color:var(--ink)}
.sample .price s{color:#8A7E72;font-weight:400;text-decoration-thickness:1.5px}
.sample .price .now{color:#9C2F1E}
.sample .price small{font-size:.8rem;color:#6B5F53}
.sample .price .ends{flex-basis:100%;font:italic .82rem/1.3 var(--sans,inherit);color:#9C2F1E}
.sample .tags{position:absolute;left:6px;top:6px;display:flex;gap:4px}
.tag{font:600 .72rem/1 var(--slab);font-style:normal;letter-spacing:.06em;text-transform:uppercase;padding:4px 6px 3px;border-radius:2px;background:rgba(250,248,243,.92);color:var(--river);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tag.sale{background:#9C2F1E;color:#FFF6EE}

/* the shelves: where you are, then what's inside */
.crumbs{font:500 .92rem/1.4 var(--slab);color:#6B5F53;margin:0 0 .2em}
.crumbs a{color:var(--river);text-decoration:none;opacity:.8}
.crumbs a:hover{opacity:1;text-decoration:underline}
.crumbs .sep{margin:0 .35em;opacity:.6}
.rail h3{font:600 1rem/1.2 var(--slab);margin:1.1em 0 .5em;color:#4F463E}
.shelves,.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.shelves{flex-direction:column;margin-bottom:.4em}
.shelf{display:flex;justify-content:space-between;align-items:baseline;width:100%;padding:.7em .9em;border:1px solid var(--line);border-radius:4px;background:rgba(255,255,255,.6);
  font:600 1.15rem/1.1 var(--slab);color:var(--river);cursor:pointer;transition:border-color .2s ease,background .2s ease}
.shelf:hover{border-color:var(--river);background:#fff}
.shelf.is-sale{color:#9C2F1E}
.chip{display:inline-flex;align-items:baseline;gap:.4em;padding:.45em .7em;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.55);
  font:600 .98rem/1.1 var(--slab);color:var(--river);cursor:pointer;transition:border-color .2s ease,background .2s ease}
.chip:hover{border-color:var(--river);background:#fff}
.n{font:500 .8rem/1 var(--sans,inherit);color:#857868}
.chips + .listh,#menu:not(:empty) + .listh{margin-top:1.2em}
#menu:not(:empty){margin-bottom:1em}
.listh{font:600 1.05rem/1.2 var(--slab)}
.small{font-size:.92rem;color:#6B5F53}

.work{display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px clamp(12px,2vw,24px) 16px}
.viewwrap{position:relative;flex:1 1 auto;min-height:0;border-radius:3px;overflow:hidden;background:#1B1916;touch-action:none}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.handle{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:0;padding:0;background:transparent;cursor:grab;touch-action:none;pointer-events:auto}
.handle::before{content:"";position:absolute;inset:13px;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 2px #2A1E0B,0 2px 8px rgba(0,0,0,.5)}
.handle:active{cursor:grabbing}
.viewwrap.painting{cursor:crosshair}
.viewwrap.painting .handle{display:none}
.msg{position:absolute;inset:auto 12px 12px 12px;padding:10px 14px;border-radius:3px;background:rgba(15,38,39,.9);color:#F3EEE4;font-size:.95rem}
/* the words under the picture sit on frosted paper, so the tile floor never runs through them */
.panel{margin-top:12px;padding:8px 16px 10px;border-radius:6px;background:rgba(250,248,243,.9);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 10px 24px -18px rgba(60,40,20,.5);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:4px 22px;padding:2px 0}
.tools .btn{min-height:40px;font-size:1.06rem;color:var(--river);opacity:.88}
/* what your finger does: three words, the one in use full and underlined */
.seg{display:inline-flex;gap:18px}
.seg button{border:0;padding:.15em .1em;min-height:40px;cursor:pointer;color:var(--river);opacity:.6;
  font:600 1.06rem/1.1 var(--slab);text-shadow:0 1px 0 rgba(255,255,255,.6),0 2px 5px rgba(70,46,24,.2);
  background:linear-gradient(currentColor,currentColor) left calc(100% - .45em)/0 1.5px no-repeat;transition:opacity .35s ease,background-size .35s ease}
.seg button:hover{opacity:.8}
.seg button[aria-pressed="true"]{opacity:1;background-size:100% 1.5px}
.tools label.rng{display:inline-flex;align-items:center;gap:8px;font:500 1rem var(--slab);color:var(--river);opacity:.8}
.tools input[type=range]{width:110px;accent-color:var(--river)}
.help{font-size:.95rem;color:#4F463E;margin:.4em 0 0;min-height:1.6em}
.chosen{font:600 1.15rem/1.3 var(--slab);margin:.2em 0 0}
.chosen a{white-space:nowrap}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.nogl{padding:24px;max-width:36em}

/* Phones and small tablets: picture on top, samples underneath */
@media (max-width:1000px){
  .studio{display:flex;flex-direction:column;height:auto;padding-top:60px}
  .work{display:contents}
  .viewwrap{order:0;position:sticky;top:60px;z-index:5;flex:none;height:min(46svh,70vw + 40px);margin:8px 10px 0;border-radius:3px;box-shadow:0 10px 18px -14px rgba(0,0,0,.6)}
  .panel{order:1;margin:10px 10px 0;padding:6px 12px 10px}
  .rail.left{order:4}.rail.right{order:5}
  .tools{gap:2px 16px}
  .tools .btn,.seg button{min-height:38px;font-size:.98rem}
  .seg{gap:14px}
  .help{font-size:.86rem;margin-top:.3em}
  .chosen{font-size:1rem}
  .rail{border:0;overflow:visible;margin:12px 10px 0;padding:14px 12px 8px;border-radius:6px}
  .rail.right{margin-bottom:40px}
  .rail.right{padding-top:14px;padding-bottom:16px}
  .samples{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .rail.right.empty{display:none}
}
</style>
</head>
<body class="studio-page">
<header class="top solid">
  <a class="brand" href="index.html">Knockel's<small>Floor Covering</small></a>
  <nav class="nav" aria-label="Main">
    <a class="navlink" href="index.html#floors">Floors</a>
    <a class="navlink" href="index.html#visit">Visit</a>
    <a class="btn btn-call" href="tel:+15635392772"><svg class="phone-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>563-539-2772</a>
  </nav>
</header>

<main class="studio">
  <aside class="rail left" aria-label="Floors">
    <nav class="crumbs" id="crumbs" aria-label="Where you are" hidden></nav>
    <h2 id="shelf-h">Floors</h2>
    <div id="menu"></div>
    <h3 class="listh" id="list-h" hidden></h3>
    <ul class="samples" id="s-left"></ul>
    <p class="small" id="empty-note" hidden>Nothing here yet. Call the store and ask.</p>
  </aside>

  <section class="work" aria-label="Your room">
    <div class="viewwrap" id="viewwrap">
      <canvas id="view" aria-label="Your room with the chosen floor"></canvas>
      <svg id="overlay" aria-hidden="true"><polygon id="quadline" fill="rgba(240,193,99,.08)" stroke="#F0C163" stroke-width="2" stroke-dasharray="6 5"/></svg>
      <p class="msg" id="msg" hidden></p>
    </div>
    <div class="panel">
    <div class="tools">
      <span class="btn btn-river filebtn">Use a picture of your room<input type="file" id="photo" accept="image/*" aria-label="Use a picture of your room"></span>
      <button type="button" class="btn btn-river" id="camera" hidden>See it through your camera</button>
      <div class="seg" role="group" aria-label="What your finger does">
        <button type="button" data-mode="corners" aria-pressed="true">Move corners</button>
        <button type="button" data-mode="keep" aria-pressed="false">Paint furniture</button>
        <button type="button" data-mode="add" aria-pressed="false">Paint floor</button>
      </div>
      <label class="rng" id="brushwrap" hidden>Brush <input type="range" id="brush" min="8" max="120" value="36"></label>
      <button type="button" class="btn btn-ghost" id="clearpaint" hidden>Clear paint</button>
      <button type="button" class="btn btn-ghost" id="turn">Turn the planks</button>
      <label class="rng">Size <input type="range" id="size" min="-100" max="100" value="0" aria-label="Plank and tile size"></label>
      <button type="button" class="btn btn-ghost" id="before">Hold for before</button>
      <button type="button" class="btn btn-ghost" id="nextroom">Another sample room</button>
      <button type="button" class="btn btn-call" id="save">Save picture</button>
    </div>
    <p class="help" id="help"></p>
    <p class="chosen" id="chosen"></p>
    </div>
  </section>

  <aside class="rail right" aria-label="More floors">
    <ul class="samples" id="s-right"></ul>
  </aside>
</main>

<script src="assets/shelf.js?v=1"></script>
<script src="assets/room.js?v=4"></script>
<script src="assets/camera.js?v=1"></script>
</body>
</html>
