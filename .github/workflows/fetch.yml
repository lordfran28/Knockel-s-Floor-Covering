name: Fetch
# Side branch only. Renders the pages in pages.txt and downloads the pictures in images.txt into out/.
on:
  push:
    branches: [fetch]
    paths: ["pages.txt", "images.txt", "run.py", ".github/workflows/fetch.yml"]
permissions:
  contents: write
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          pip install -q playwright requests pillow
          python -m playwright install --with-deps chromium > /dev/null
      - name: Fetch
        run: python run.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A out
          git diff --cached --quiet && exit 0
          git commit -q -m "Fetched"
          git pull -q --rebase origin fetch && git push -q origin HEAD:fetch
