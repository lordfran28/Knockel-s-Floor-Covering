name: Catalog
# When inventory.csv or sales.csv changes (prices, sales, what's in stock), rebuild catalog.json.
on:
  push:
    branches: [main]
    paths: ["inventory.csv", "special-order.csv", "sales.csv", "tools/inventory.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild catalog.json
        run: python3 tools/inventory.py || true
      - name: Save it
        run: |
          if git diff --quiet catalog.json; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Update the floors from the inventory"
          git pull --rebase origin main && git push
